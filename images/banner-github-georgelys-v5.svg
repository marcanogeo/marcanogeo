<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Banner de perfil de GitHub de Georgelys Marcano, version 2</title>
<desc>Fondo grafito casi negro con acento verde senal, wordmark en minusculas, flujo interfaz-dato-decision y enlaces de contacto</desc>

<rect width="1200" height="300" fill="#0B0E14"/>

<g font-family="'Courier New', monospace" font-size="14" opacity="0.22">
<text x="700" y="38" fill="#4ADE80">const client = mqtt.connect(broker);</text>
<text x="700" y="76" fill="#E7E7E2">&#160;</text>
<text x="700" y="84" fill="#4ADE80">client.on('message', (topic, payload) =&gt; {</text>
<text x="724" y="108" fill="#E7E7E2">const { temp, humidity } = JSON.parse(payload);</text>
<text x="724" y="132" fill="#E7E7E2">store.dispatch(updateReading({ temp, humidity }));</text>
<text x="700" y="156" fill="#4ADE80">});</text>
<text x="700" y="190" fill="#4ADE80">export function Dashboard() {</text>
<text x="724" y="214" fill="#E7E7E2">const data = useLiveData();</text>
<text x="724" y="238" fill="#E7E7E2">return &lt;Chart series={data} /&gt;;</text>
<text x="700" y="250" fill="#4ADE80">}</text>
</g>

